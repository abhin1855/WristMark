<!-- dashboard.html -->
<!DOCTYPE html>

{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Store Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/darkmode.css' %}">

</head>
<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <h2>Wrist<span>Mark</span></h2>
            <p>OWNER PANEL</p>
        </div>

        <div class="menu-section">
            <p class="menu-title">MAIN</p>

            <ul>
                <li class="active">
                    <a class="menu-link" href="{% url 'dashboard' %}">
                    <i class="ri-dashboard-line"></i>
                    Dashboard
                    </a>
                </li>

                <li>
                    <a class="menu-link" href="{% url 'watch_page' %}">
                        <i class="ri-time-line"></i>
                        <span>Watches</span>
                    </a>
                </li>

                <li>
                    <a class="menu-link" href="{% url 'order_page' %}">
                    <i class="ri-file-list-3-line"></i>
                    Orders
                    <span class="badge">4</span>
                    </a>
                </li>

                <li>
                    <a class="menu-link" href="{% url 'buyer_page' %}">
                    <i class="ri-group-line"></i>
                    Buyers
                    </a>
                </li>
            </ul>
        </div>

        <div class="menu-section">
            <p class="menu-title">STORE</p>

            <ul>
                <li>
                    <a class="menu-link" href="{% url 'category_page' %}">
                    <i class="ri-menu-line"></i>
                    Categories
                    </a>
                </li>

                <li>
                    <a class="menu-link" href="{% url 'promotion_page' %}">
                    <i class="ri-price-tag-3-line"></i>
                    Promotions
                    </a>
                </li>

                <li>
                    <a class="menu-link" href="{% url 'review_page' %}">
                    <i class="ri-star-line"></i>
                    Reviews
                    </a>
                </li>

                <li>
                    <a class="menu-link" href="{% url 'return_page' %}">
                    <i class="ri-arrow-go-back-line"></i>
                    Returns
                    <span class="badge">2</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="bottom-menu">
            <ul>
                <li>
                    <a class="menu-link" href="{% url 'profile_page' %}">
                    <i class="ri-user-line"></i>
                    Profile
                    </a>
                </li>

                <li>
                    <a class="menu-link" href="{% url 'settings_page' %}">
                    <i class="ri-settings-3-line"></i>
                    Settings
                    </a>
                </li>
            </ul>

            <div class="profile-box">
                <a href="{% url 'profile_page' %}" class="profile-link">
                    <div class="avatar">WM</div>
                    <div class="profile-info">
                        <h4>Admin</h4>
                        <p>Owner</p>
                    </div>
                </a>

                <a href="{#}" class="logout-icon">
                    <i class="ri-logout-box-r-line"></i>
                </a>
            </div>
        </div>

    </aside>
    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <div class="topbar">

            <div class="topbar-left">

                <a href="{% url 'dashboard' %}" class="back-btn">
                    <i class="ri-arrow-left-line"></i>
                </a>

                <div>
                    <h2></h2>
                    <p></p>
                </div>

            </div>

            <div class="topbar-right">

                <div class="live-date" id="liveDate"></div>

                <button class="topbar-theme-switch" id="themeToggle">
                    <span class="topbar-slider">
                        <i class="ri-sun-line theme-icon"
                           id="themeIcon"></i>
                    </span>

                </button>

                <button class="notification-btn">
                    <i class="ri-notification-3-line"></i>
                </button>

            </div>

        </div>

        <!-- STATS -->
        <div class="stats-grid">

            <div class="stat-card revenue">
                <div>
                    <p></p>
                    <h2></h2>
                    <span></span>
                </div>

                <i class="ri-money-dollar-circle-line"></i>
            </div>

            <div class="stat-card orders">
                <div>
                    <p></p>
                    <h2></h2>
                    <span></span>
                </div>

                <i class="ri-shopping-bag-line"></i>
            </div>

            <div class="stat-card watches">
                <div>
                    <p></p>
                    <h2></h2>
                    <span></span>
                </div>

                <i class="ri-focus-2-line"></i>
            </div>

            <div class="stat-card buyers">
                <div>
                    <p></p>
                    <h2></h2>
                    <span></span>
                </div>

                <i class="ri-user-3-line"></i>
            </div>

        </div>



    </main>

</div>

<script src="{% static 'js/theme.js' %}"></script>

</body>
</html>
